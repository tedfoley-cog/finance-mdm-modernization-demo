[project]
name = "ledgercore-mdm"
version = "4.7.2"
description = "LedgerCore finance master data management platform: steward API, ingest pipelines, warehouse publishing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "duckdb>=1.1",
    "sqlglot>=25",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyspark>=3.5",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
snowflake = ["snowflake-connector-python[pandas]>=3.10"]

[tool.setuptools.packages.find]
include = ["api*", "pipelines*", "tools*", "mdm_core*"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["legacy", "web", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tools/depgraph/*" = ["E501"]  # regex tables and HTML templates

[tool.pytest.ini_options]
testpaths = ["api/tests", "pipelines/tests", "tools/depgraph/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
